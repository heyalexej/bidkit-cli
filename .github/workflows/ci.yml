# Type checks on 3.11, plus tests + lint across the supported Python range.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --extra dev
      # ty is pinned in dev and run on the project's minimum supported Python
      # only; the other matrix versions still run tests and lint below.
      - name: Type check (ty)
        if: matrix.python-version == '3.11'
        run: uv run ty check src tests
      - name: Tests
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check src tests
