# Tests + lint on every push/PR, across the supported Python range.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: bidkit-cli
    steps:
      - uses: actions/checkout@v4
        with:
          path: bidkit-cli
      # tool.uv.sources resolves bidkit from the sibling checkout (the layout
      # bootstrap.sh documents); pin the tag the manifest was generated against.
      - uses: actions/checkout@v4
        with:
          repository: heyalexej/bidkit
          ref: "v0.2.0"
          path: bidkit
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --extra dev
      - name: Tests
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check src tests
