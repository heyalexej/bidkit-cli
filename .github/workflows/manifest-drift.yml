# Proves the committed CLI manifest regenerates byte-for-byte from a clean
# bidkit checkout plus the tracked generator patch, and that every manifest
# method exists on the installed bidkit resource (parity).
name: manifest-drift

on:
  push:
    branches: [main]
    paths:
      - src/bidkit_cli/generated/**
      - patches/**
      - scripts/**
      - skills/**
      - .github/workflows/manifest-drift.yml
  pull_request:
    paths:
      - src/bidkit_cli/generated/**
      - patches/**
      - scripts/**
      - skills/**

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Check out the bidkit dependency
        uses: actions/checkout@v4
        with:
          repository: heyalexej/bidkit
          # Pin to the bidkit generation the manifest was produced from. Bump
          # intentionally together with a manifest regeneration + range bump.
          ref: "v0.3.0"
          path: bidkit-checkout

      - name: Install bidkit (editable) + CLI dev deps
        run: |
          uv venv --clear
          # [dev] brings datamodel-code-generator for the generator run below.
          uv pip install -e "bidkit-checkout[dev]"
          # bidkit comes from the pinned checkout above so the manifest is
          # regenerated against the exact SDK generation it was produced from.
          uv pip install -e .[dev]

      # Run tools from the job venv directly: `uv run` would re-resolve the
      # project and reinstall bidkit from PyPI over the pinned checkout above.
      - name: Regenerate manifest from the clean bidkit checkout
        # The bidkit generator shells out to a bare `datamodel-codegen`, which
        # only exists in the job venv's bin dir; put that on PATH while still
        # invoking the venv python directly to avoid a uv re-resolution.
        run: PATH="$PWD/.venv/bin:$PATH" .venv/bin/python scripts/regenerate_manifest.py --bidkit-dir bidkit-checkout

      # The skill's generated pages are a view over the same manifest, so they
      # drift for exactly the same reasons and are held to the same standard:
      # regenerating them must produce no diff.
      - name: Regenerate the skill docs
        run: PYTHONPATH=src .venv/bin/python scripts/generate_skill_docs.py

      - name: Skill docs drift
        run: git diff --exit-code -- skills/

      - name: Manifest/resource parity + tests
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/python -m ruff check src tests
