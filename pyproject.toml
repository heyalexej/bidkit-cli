[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "bidkit-cli"
version = "0.2.0"
description = "Command-line interface for the bidkit eBay SDK — every generated operation, callable from the shell."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bidkit contributors" }]
keywords = ["ebay", "cli", "sdk", "api", "sell", "buy", "commerce"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  # Bounded to the 0.3.x series: the command surface is generated from a
  # specific bidkit generation snapshot, and a future minor/major can rename
  # methods/services. Bump intentionally when the manifest is regenerated.
  "bidkit>=0.3.0,<0.4",
  "click>=8.1,<9",
  "httpx2>=2.9",
  "rich>=13,<15",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "ty==0.0.65",
]

# The console script is `bidkit` (the human-facing tool name), even though the
# distribution is bidkit-cli so library users don't pull Click/Rich transitively.
[project.scripts]
bidkit = "bidkit_cli.app:main"

[project.urls]
Homepage = "https://github.com/heyalexej/bidkit-cli"
Repository = "https://github.com/heyalexej/bidkit-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/bidkit_cli"]
# Package the progressive-disclosure agent skill into the wheel so
# `bidkit skill` resolves it from an installed distribution.
[tool.hatch.build.targets.wheel.force-include]
"skills/bidkit-cli" = "bidkit_cli/skill"

[tool.hatch.build.targets.sdist]
include = ["src/bidkit_cli", "skills", "scripts", "patches", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
# Pin to the project's minimum supported Python so CI gates on the version
# where new typing syntax is most likely to fail, not the latest in the matrix.
python-version = "3.11"
